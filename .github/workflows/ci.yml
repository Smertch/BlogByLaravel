name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PHP_VERSION: '8.5'
    PHP_EXTENSIONS: 'intl, pdo, pdo_mysql, mbstring, zip, bcmath, opcache'
    COMPOSER_NO_INTERACTION: '1'
    COMPOSER_PROCESS_TIMEOUT: '0'

jobs:
    composer-validate:
        name: composer validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none
                  tools: composer:v2
            - run: composer validate --strict --no-check-publish

    lint:
        name: Lint (Pint)
        runs-on: ubuntu-latest
        needs: composer-validate
        steps:
            - uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run Pint
              run: vendor/bin/pint --test

    phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        needs: composer-validate
        steps:
            - uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress

    tests:
        name: PHPUnit
        runs-on: ubuntu-latest
        needs: composer-validate

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: blog_test
                    MYSQL_USER: user
                    MYSQL_PASSWORD: password
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: blog_test
            DB_USERNAME: user
            DB_PASSWORD: password
            APP_ENV: testing
            APP_KEY: base64:uP0S+pLpU6G1M6i1y8n9rU5vV7wX9yBzC1dE3fG5hI7=

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Create .env
              run: cp .env.example .env

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run Migrations
              run: php artisan migrate --force

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=always
