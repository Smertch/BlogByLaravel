server {
    listen 80 default;

    # Разрешение имён при запросе, а не при старте (php-fpm может быть ещё не готов)
    resolver 127.0.0.11 valid=10s;
    set $php_backend php-fpm:9000;

    client_max_body_size 108M;

    access_log /var/log/nginx/application.access.log;

    # Prometheus nginx-exporter (internal Docker networks + localhost)
    location = /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    root /application/public;
    index index.php;

    # Отключить кэш в разработке (старая версия страницы не показывается)
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";

    # try to serve file directly, fallback to index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    if (!-e $request_filename) {
        rewrite ^.*$ /index.php last;
    }

    location ~ \.php$ {
        fastcgi_pass $php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/application_php_errors.log";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }
}
