modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      method: GET

  # Главная может отдавать 302 на логин — считаем ответ «живым»
  http_app:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      method: GET
      valid_status_codes: [200, 301, 302, 401, 403]

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
